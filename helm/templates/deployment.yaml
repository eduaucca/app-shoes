apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shoes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true" #Activa la inyección de Azure
        app: {{ .Release.Name }}-web
    spec:
      serviceAccountName: shoes-sa #Vincula el Pod con la identidad
      containers:
      - name: servidor-web
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.puerto }} 
        resources:
          limits:
            cpu: {{ .Values.cpuLimit }}
            memory: {{ .Values.memoryLimit }}
          requests:
            cpu: "50m"
            memory: "64Mi"
