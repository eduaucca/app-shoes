apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-shoes
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Cambiar a true cuando añadas TLS/HTTPS
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app-shoes.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
