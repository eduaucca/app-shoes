apiVersion: v1
kind: Service
metadata:
  name: servicio-shoes
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.puerto }}"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  selector:
    # IMPORTANTE: Esta etiqueta debe coincidir con la que pusiste en tu deployment
    app: {{ .Release.Name }}-web
  ports:
    - protocol: TCP
      port: {{ .Values.puerto }}
      targetPort: {{ .Values.puerto }}
