apiVersion: v1
kind: Pod
spec:
  containers:
  - name: kaniko
    image: gcr.io/kaniko-project/executor:debug
    command:
    - sleep
    args:
    - 9999999
    volumeMounts:
    - name: docker-config
      mountPath: /kaniko/.docker/
  
  - name: terraform
    image: hashicorp/terraform:1.5.0
    command:
    - sleep
    args:
    - 9999999
  
  - name: azure-cli
    image: mcr.microsoft.com/azure-cli:latest
    command:
    - sleep
    args:
    - 9999999
  
  - name: helm
    image: alpine/helm:3.12.0
    command:
    - sleep
    args:
    - 9999999
  
  volumes:
  - name: docker-config
    secret:
      secretName: acr-secret
      items:
      - key: .dockerconfigjson
        path: config.json
